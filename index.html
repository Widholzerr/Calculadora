<!DOCTYPE html>
<html>
<head>
    <title>Calculadora</title>
    <link rel="stylesheet" href="./Estilos/styles.css">
    
    <meta charset="UTF-8">
</head>
<body>
    <main>
        <div class="calculadora">
            <div class="display" id="display">0</div>
            <div class="botoes">
                <div class="linha">
                    <button class="botao" id="ac" >AC</button>
                    <button class="botao" id="mais-menos" >±</button>
                    <button class="botao" id="porcento" >%</button>
                    <button class="divisao" >÷</button>
                </div>
                <div class="linha">
                    <button class="botao" id="7" >7</button>
                    <button class="botao" >8</button>
                    <button class="botao" >9</button>
                    <button class="multiplicacao" >×</button>
                </div>
                <div class="linha">
                    <button class="botao" >4</button>
                    <button class="botao" >5</button>
                    <button class="botao" >6</button>
                    <button class="subtracao" >-</button>
                </div>
                <div class="linha">
                    <button class="botao" >1</button>
                    <button class="botao" >2</button>
                    <button class="botao" >3</button>
                    <button class="adicao" >+</button>
                </div>
                <div class="linha">
                    <button class="botao zero" >0</button>
                    <button class="virgula" >,</button>
                    <button class="resultado" >=</button>
                </div>
            </div>
        </div>
    </main>
    <script src="./Scripts/scripts.js"></script>
</body>
</html>
